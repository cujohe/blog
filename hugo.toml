baseURL = "https://cujohe.github.io/blog/"
languageCode = "zh-cn"
title = "Cujohe's Blog"
theme = "PaperMod"

# PaperMod: 首页展示这些 section 的文章
mainSections = ["python", "deepteam"]

[params]
  description = "学习、思考、记录"
  author = "cujohe"

  # 首页 Profile 模式 —— 干净的导航页
  [params.profileMode]
    enabled = true
    title = "Cujohe's Blog"
    subtitle = "学习、思考、记录 | Obsidian 驱动，Hugo 构建"
    
    [[params.profileMode.buttons]]
      name = "🐍 Python 完全教程"
      url = "/blog/python/"

    [[params.profileMode.buttons]]
      name = "🔴 DeepTeam 红队测试"
      url = "/blog/deepteam/"

  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/cujohe"

  # 开启面包屑
  ShowBreadCrumbs = true
  ShowPostNavLinks = true

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
